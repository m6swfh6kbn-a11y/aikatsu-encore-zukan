
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8b7d0">
<title>アイカツ！アンコール図鑑</title>
<style>
:root{--pink:#f5a8c6;--dark:#813c60;--bg:#fff7fb;--line:#f0d3e1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#513748;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
header{padding:24px 16px 18px;background:linear-gradient(135deg,#ffd9e8,#f5a8c6);text-align:center}
h1{font-size:23px;margin:0 0 7px}
header p{margin:0;font-size:12px}
nav{display:flex;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid var(--line)}
nav button{flex:1;border:0;background:white;padding:13px 2px;color:#80566b;font-size:12px}
nav button.active{background:#ffe5ef;color:#873d62;font-weight:bold;border-bottom:3px solid var(--pink)}
main{padding:15px;max-width:760px;margin:auto}
h2{font-size:20px;margin:7px 0}
.note{font-size:12px;color:#8a6a7b;line-height:1.6}
.card{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;margin:12px 0;box-shadow:0 3px 10px #a95b8010}
.card h3{font-size:15px;margin:0 0 10px}
label{font-size:12px;color:#896579;display:block;margin:8px 0 4px}
input[type=text],textarea,select{width:100%;padding:10px;border:1px solid #e6c4d4;border-radius:9px;background:#fffafd;color:#513748;font:inherit;font-size:14px}
textarea{min-height:58px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px}
input[type=checkbox]{accent-color:#e77eaa;width:19px;height:19px}
button,.filebtn{cursor:pointer}
.action{background:#f5a8c6;color:#66334c;border:0;border-radius:10px;padding:10px 13px;font-size:13px;font-weight:600}
.secondary{background:#fff;border:1px solid #e6c4d4;color:#80566b;border-radius:10px;padding:9px 12px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1}
.progress{height:8px;background:#f5e3eb;border-radius:8px;overflow:hidden;margin:10px 0}
.progress span{display:block;height:100%;background:#e77eaa;width:0}
.stamps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stamp{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px;text-align:center}
.stamp .seal{width:58px;height:58px;border-radius:50%;margin:0 auto 7px;background:#ffe5ef;border:2px dashed #e89abb;display:grid;place-items:center;font-size:23px}
.stamp.done .seal{background:#f5a8c6;border-style:solid}
.stamp input[type=text]{font-size:12px;padding:7px;text-align:center}
.stamp .check{justify-content:center}
.hidden{display:none!important}
footer{text-align:center;padding:25px 10px;color:#a17c91;font-size:11px}
</style>
</head>
<body>
<header>
<h1>アイカツ！アンコール図鑑</h1>
<p>あつめて、そろえて、わたしだけのアイカツ！</p>
</header>
<nav>
<button class="active" data-tab="idol">アイドル解放</button>
<button data-tab="plate">プレート</button>
<button data-tab="stamp">スタンプ帳</button>
</nav>
<main>
<section id="idol">
<h2>アイドル解放図鑑</h2>
<p class="note">解放条件を記録して、解放できたアイドルにチェックしよう。</p>
<div id="idolProgress" class="note"></div><div class="progress"><span id="idolBar"></span></div>
<div id="idolList"></div>
</section>
<section id="plate" class="hidden">
<h2>アイドルプレート図鑑</h2>
<p class="note">条件はいつでも編集できるよ。不明な情報は「未確認」のままでOK！</p>
<div id="plateProgress" class="note"></div><div class="progress"><span id="plateBar"></span></div>
<div id="plateList"></div>
</section>
<section id="stamp" class="hidden">
<h2>アイカツ！スタンプ帳</h2>
<p class="note">ゲーム内で獲得したスタンプを自分でタップして記録しよう。</p>
<div class="row">
<select id="editionSelect" aria-label="スタンプ帳の版"></select>
<button class="action" id="addEdition">＋ 版を追加</button>
</div>
<div id="stampProgress" class="note" style="margin-top:12px"></div>
<div class="progress"><span id="stampBar"></span></div>
<div id="stampList" class="stamps"></div>
</section>
<hr style="border:0;border-top:1px solid var(--line);margin:24px 0">
<h2>データのバックアップ</h2>
<p class="note">記録はこのブラウザに自動保存されるよ。機種変更やデータ消失に備えて、定期的にバックアップを保存してね。</p>
<div class="row">
<button class="action" id="export">バックアップを書き出す</button>
<label class="filebtn secondary" style="text-align:center;margin:0">バックアップを復元<input id="importFile" type="file" accept=".json,application/json" hidden></label>
</div>
<p id="message" class="note" role="status"></p>
</main>
<footer>アイカツ！アンコール図鑑 · マイコレクション</footer>
<script>
const plateNames=[
"わたしのアイカツ！はじまります！","はじめてのアンコール♪",
"もっとこえをきかせて！","アンコールステージを100かいせいこう",
"さいこうのパフォーマンス","はじめてパーフェクトフルコンボをたっせい",
"アイドルのたまご","かけだしアイドル",
"アイドルランク10たっせい","アイドルランク15たっせい",
"アイドルランク20たっせい","アイドルランク25たっせい",
"アイドルランク30たっせい","アイドルランク35たっせい",
"アイドルランク40たっせい",
"いちごで10かいアンコールステージせいこう",
"あおいで10かいアンコールステージせいこう",
"らんで10かいアンコールステージせいこう",
"あかりで10かいアンコールステージせいこう",
"らきで10かいアンコールステージせいこう",
"ノエルで10かいアンコールステージせいこう",
"ハナで10かいアンコールステージせいこう",
"みえるで10かいアンコールステージせいこう",
"メエで10かいアンコールステージせいこう",
"パリンで10かいアンコールステージせいこう",
"たいむで10かいアンコールステージせいこう"
];
const idolNames=["星宮いちご","霧矢あおい","紫吹蘭","大空あかり","姫石らき","音城ノエル","ハナ","姫乃みえる","真未夢メエ","和央パリン","凛堂たいむ"];
const defaultData=()=>({
idols:idolNames.map(name=>({name,condition:"解放条件：未確認",unlocked:false})),
plates:plateNames.map(name=>({name,condition:"獲得条件：未確認",status:"未確認",acquired:false})),
editions:[
{name:"通常版",stamps:Array.from({length:10},(_,i)=>({name:"スタンプ "+(i+1),reward:"報酬・条件：未確認",done:false}))},
{name:"ハロウィン版",stamps:Array.from({length:10},(_,i)=>({name:"スタンプ "+(i+1),reward:"報酬・条件：未確認",done:false}))}
],selected:0
});
let data;
try{data=JSON.parse(localStorage.getItem("aikatsuEncoreZukanV1"))||defaultData()}catch(e){data=defaultData()}
data.idols[7].name="姫乃みえる";
data.idols[8].name="真未夢メエ";
data.idols[9].name="和央パリン";
data.idols[10].name="凛堂たいむ";
localStorage.setItem("aikatsuEncoreZukanV1",JSON.stringify(data));
function save(){localStorage.setItem("aikatsuEncoreZukanV1",JSON.stringify(data));renderProgress()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderProgress(){
const a=data.idols.filter(x=>x.unlocked).length;
document.getElementById("idolProgress").textContent=`解放済み：${a} / ${data.idols.length}`;
document.getElementById("idolBar").style.width=(a/Math.max(1,data.idols.length)*100)+"%";
const p=data.plates.filter(x=>x.acquired).length;
document.getElementById("plateProgress").textContent=`獲得済み：${p} / ${data.plates.length}`;
document.getElementById("plateBar").style.width=(p/Math.max(1,data.plates.length)*100)+"%";
const ed=data.editions[data.selected];
if(ed){const n=ed.stamps.filter(x=>x.done).length;document.getElementById("stampProgress").textContent=`${ed.name}：${n} / ${ed.stamps.length} 個獲得`;document.getElementById("stampBar").style.width=(n/Math.max(1,ed.stamps.length)*100)+"%"}
}
function renderIdols(){
document.getElementById("idolList").innerHTML=data.idols.map((x,i)=>`<article class="card">
<h3>${esc(x.name)}</h3><label>解放条件</label><p>${esc(x.condition)}</p>
<label class="check"><input type="checkbox" data-kind="idol" data-i="${i}" data-field="unlocked" ${x.unlocked?"checked":""}> 解放済み</label>
</article>`).join("");
}
function renderPlates(){
document.getElementById("plateList").innerHTML=data.plates.map((x,i)=>`<article class="card">
<h3>${esc(x.name)}</h3>
<label>情報の状態</label><select data-kind="plate" data-i="${i}" data-field="status">${["未確認","推測","確認済み"].map(s=>`<option ${x.status===s?"selected":""}>${s}</option>`).join("")}</select>
<label class="check"><input type="checkbox" data-kind="plate" data-i="${i}" data-field="acquired" ${x.acquired?"checked":""}> 獲得済み</label>
</article>`).join("");
}
function renderEditions(){
document.getElementById("editionSelect").innerHTML=data.editions.map((x,i)=>`<option value="${i}">${esc(x.name)}</option>`).join("");
data.selected=Math.min(data.selected,data.editions.length-1);
document.getElementById("editionSelect").value=data.selected;
}
function renderStamps(){
const ed=data.editions[data.selected];if(!ed)return;
document.getElementById("stampList").innerHTML=ed.stamps.map((x,i)=>`<article class="stamp ${x.done?"done":""}">
<div class="seal">${x.done?"★":"♡"}</div>
<input aria-label="スタンプ名" type="text" data-kind="stamp" data-i="${i}" data-field="name" value="${esc(x.name)}">
<label>報酬・条件</label><input aria-label="報酬や条件" type="text" data-kind="stamp" data-i="${i}" data-field="reward" value="${esc(x.reward)}">
<label class="check"><input type="checkbox" data-kind="stamp" data-i="${i}" data-field="done" ${x.done?"checked":""}> 獲得済み</label>
</article>`).join("");
}
function render(){renderIdols();renderPlates();renderEditions();renderStamps();renderProgress()}
document.querySelector("nav").addEventListener("click",e=>{
const b=e.target.closest("button[data-tab]");if(!b)return;
document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));
["idol","plate","stamp"].forEach(id=>document.getElementById(id).classList.toggle("hidden",id!==b.dataset.tab));
});
document.addEventListener("change",e=>{
const el=e.target;if(!el.dataset.kind)return;
const i=Number(el.dataset.i),field=el.dataset.field;
let item;
if(el.dataset.kind==="idol")item=data.idols[i];
if(el.dataset.kind==="plate")item=data.plates[i];
if(el.dataset.kind==="stamp")item=data.editions[data.selected].stamps[i];
if(!item)return;
item[field]=el.type==="checkbox"?el.checked:el.value;
if(el.dataset.kind==="stamp")renderStamps();
save();
});
document.getElementById("editionSelect").addEventListener("change",e=>{data.selected=Number(e.target.value);renderStamps();save()});
document.getElementById("addEdition").addEventListener("click",()=>{
const name=prompt("追加する版の名前を入力してね（例：第2弾）");
if(!name||!name.trim())return;
data.editions.push({name:name.trim(),stamps:Array.from({length:10},(_,i)=>({name:"スタンプ "+(i+1),reward:"報酬・条件：未確認",done:false}))});
data.selected=data.editions.length-1;renderEditions();renderStamps();save();
});
document.getElementById("export").addEventListener("click",()=>{
const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
const url=URL.createObjectURL(blob),a=document.createElement("a");
a.href=url;a.download="aikatsu-encore-backup.json";a.click();URL.revokeObjectURL(url);
document.getElementById("message").textContent="バックアップの書き出しを開始したよ。ファイルを「ファイル」アプリなどに保存してね。";
});
document.getElementById("importFile").addEventListener("change",async e=>{
const f=e.target.files[0];if(!f)return;
try{
const d=JSON.parse(await f.text());
if(!Array.isArray(d.idols)||!Array.isArray(d.plates)||!Array.isArray(d.editions))throw Error();
if(!confirm("現在の記録をバックアップの内容で置き換える？"))return;
data=d;data.selected=Math.max(0,Math.min(Number(data.selected)||0,data.editions.length-1));save();render();
document.getElementById("message").textContent="バックアップを復元したよ！";
}catch(err){alert("このバックアップファイルを読み込めなかったよ。正しいJSONファイルか確認してね。")}
e.target.value="";
});
render();
</script>
</body>
</html>
